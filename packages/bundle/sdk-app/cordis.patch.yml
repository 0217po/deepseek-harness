# The SDK application over dsh-base. Stdout belongs exclusively to JSON-RPC.

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: sdk-app-startup
      name: '@deepseek-ai/dsh-sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

- id: hmr
  disabled: true

# Bundled script runtime and Office skills, the composition Desktop mounts as
# `desktop-office`. A carrier that ships the primary-runtime payload (for
# example a container image layer) names it with DSH_PRIMARY_RUNTIME; its
# sibling `office-skills/` directory carries the skill resources. Unset, both
# rows stay disabled and the profile is unchanged.
- insert:
    - id: workspace-dependencies
      name: '@deepseek-ai/dsh-tool-workspace-dependencies'
      disabled: !!js "!process.env.DSH_PRIMARY_RUNTIME"
      config:
        source: !!js process.env.DSH_PRIMARY_RUNTIME ?? ''

    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      disabled: !!js "!process.env.DSH_PRIMARY_RUNTIME"
      config:
        # The payload's parent directory plus office-skills, without a path module in the expression scope.
        assetRoot: !!js "process.env.DSH_PRIMARY_RUNTIME ? process.env.DSH_PRIMARY_RUNTIME.replace(/[\\\\/]+[^\\\\/]+[\\\\/]*$/, '') + '/office-skills' : ''"
