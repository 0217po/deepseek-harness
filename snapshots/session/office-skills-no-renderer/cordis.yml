- insert:
    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      config:
        assetRoot: !!js process.cwd() + '/office-skills'

- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: high
    maxTokens: 8192
    models:
      - id: deepseek-v4-flash

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- insert:
    - id: office-commands
      name: '@deepseek-ai/dsh-skill-office/commands'
      config:
        command: false
