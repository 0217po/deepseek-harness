- insert:
    - id: skill-office
      name: '@deepseek-ai/dsh-skill-office'
      config:
        assetRoot: !!js process.cwd() + '/office-skills'

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tools
  config:
    mode: ptc

- insert:
    - id: office-commands
      name: '@deepseek-ai/dsh-skill-office/commands'
      config:
        command: !!js "[process.cwd() + '/office-node', process.cwd() + '/render-cli.cjs']"
