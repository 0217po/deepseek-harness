# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

# Reminder execution is refused before the Host Schedule service is used.
- insert:
    - id: refused-schedule-service
      name: '../../../packages/schedule/tool-schedule/tests/fixtures/refused-schedule-service.ts'
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: parent
    - id: preset-parent
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: parent
        plugins:
          - name: '@deepseek-ai/dsh-tool-schedule'
    - id: parent-agent-preset
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/parent-agent-preset.ts'
