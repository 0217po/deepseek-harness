# The cold-resume lane's own overlay: the bounded terminal fixture the terminal
# replacement case drives, plus a pinned desktop so the document header's
# "Open" control lands in the file-preview golden on every platform.
- id: terminal-controller
  config:
    maxTerminals: 2
    unattendedTimeoutMs: 2000
    activityPollIntervalMs: 100
    cleanupRetryMs: 100
    shellCandidates: [/bin/bash, /bin/sh]
    shell:
      path: /bin/bash
      name: bash
      args: [--noprofile, --norc, -i]
- id: session-controller
  config:
    nativeOpen: true
